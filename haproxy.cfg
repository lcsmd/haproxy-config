global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 2048
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    pidfile /run/haproxy.pid

defaults
    log     global
    mode    http
    option http-keep-alive
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats realm Haproxy\ Statistics
    stats auth admin:apgar-66
    stats refresh 10s
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/wildcard.pem ciphers HIGH:!aNULL:!MD5
    mode http
    log global
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request add-header X-Real-IP %[src]
    
    # Special case: HAL WebSocket routing (must come before map lookup)
    acl is_hal_ws hdr(host) -i hal.lcs.ai
    acl has_websocket_upgrade hdr(Connection) -m sub Upgrade
    use_backend hal_voice_ws_only if is_hal_ws has_websocket_upgrade
    
    # Map-based routing: lookup domain in map, use result as backend
    use_backend %[req.hdr(host),lower,map(/etc/haproxy/domain_routing.map)] if { hdr(host) -i .lcs.ai }
    
    # Fallback for unmatched domains
    default_backend fallback_backend

frontend http_in
    bind *:80
    mode http
    log global
    acl is_openai hdr(host) -i openai.lcs.ai
    acl is_anthropic hdr(host) -i anthropic.lcs.ai
    acl is_caprover hdr(host) -i caprover.lcs.ai
    use_backend openai_backend if is_openai
    use_backend anthropic_backend if is_anthropic
    use_backend caprover_backend if is_caprover
    http-request redirect scheme https code 301 if !is_openai !is_anthropic !is_caprover

backend nextcloud_backend
    option forwardfor
    option httpchk GET /status.php
    http-request set-header X-Forwarded-Proto https
    server nextcloud 10.1.40.17:8080 check

backend webmin_backend
    option forwardfor
    server webmin 10.1.50.1:10000 check

backend n8n_backend
    option forwardfor
    server n8n 10.1.40.17:5678 check

backend nas_backend
    option forwardfor
    server nas 10.1.32.100:5001 ssl verify none

backend chat_backend
    option forwardfor
    server chat 10.1.40.17:3000 check

backend ollama_backend
    option forwardfor
    server ollama 10.1.10.20:11434 check

backend speech_backend
    option forwardfor
    server ubuai 10.1.10.20:5000 check

backend accuterm_backend
    option forwardfor
    server accuterm 10.1.34.103:4380 ssl verify none

backend fallback_backend
    option forwardfor
    server fallback 127.0.0.1:8081 check

frontend idrac_front
    option tcplog
    bind *:8443 ssl crt /etc/haproxy/certs/wildcard.pem
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend idrac_backend if { req.ssl_sni -i idrac.lcs.ai }

backend idrac_backend
    mode tcp
    server idrac 10.1.34.102:443 ssl verify none

backend caprover_backend
    mode http
    server caprover_node 10.1.50.5:4000 check

backend pihole_lcs_ai_backend
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    option httpchk GET /admin
    http-check expect rstatus (2|3)[0-9][0-9]
    server pihole_lcs_ai 10.1.50.1:443 ssl verify none check inter 5s rise 2 fall 3
    http-request redirect location /admin/ code 301 if { path -i / }

backend dash_lcs_ai_backend
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    server dash_lcs_ai 10.1.50.5:7575 check

backend homeassistant_backend
    option forwardfor
    server homeassistant 10.1.100.10:8123 check

backend openai_backend
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    server openai api.openai.com:443 ssl verify none sni str(api.openai.com)

backend anthropic_backend
    mode http
    option forwardfor
    server anthropic api.anthropic.com:443 ssl verify none sni str(api.anthropic.com)

backend voice_gateway
    mode http
    option forwardfor
    timeout tunnel 3600s
    timeout server 3600s
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    server voice1 10.1.34.103:8765 check

backend ham_backend
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    server web1 10.1.40.17:5000 check

backend hal_voice_http_only
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    server hal_http 10.1.34.103:8080 check

backend hal_voice_ws_only
    mode http
    option forwardfor
    timeout tunnel 3600s
    timeout server 3600s
    http-request set-header X-Forwarded-Proto https
    server hal_ws 10.1.34.103:8768 check

backend sal_backend
    option forwardfor
    server sal 10.1.50.2:3000 check

backend photoprism_backend
    option forwardfor
    option httpchk GET /api/v1/status
    http-request set-header X-Forwarded-Proto https
    server photoprism 10.1.34.106:2342 check

backend voicebox_backend
    mode http
    option forwardfor
    option httpchk GET /health
    http-check expect status 200
    timeout server 3600s
    timeout tunnel 3600s
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    server voicebox 10.1.10.20:17493 check inter 5s rise 2 fall 3
